name: Build and Push docker image

on:
  push:
    branches: [ main ]

jobs:
  build_and_push:         # Changed space to underscore
    runs-on: ubuntu-latest
    steps:                # Indented steps under the job
      - name: Check out the repository
        uses: actions/checkout@v2

      - name: Docker build
        run: hostnamectl   # Note: This command shows system info, not a docker build